{% extends 'base.html' %}

{% block title %}{{ movie.title }} — Dəyiş{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1>Filmi dəyiş</h1>
                <p class="text-secondary">"{{ movie.title }}" filminin məlumatlarını yeniləyin.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    {{ form.as_div }}

                    <div class="d-flex flex-wrap gap-2 pt-3 mt-3 border-top">
                        <button type="submit" class="btn btn-primary">Yadda saxla</button>
                        <a href="{% url 'movies:movies_list' %}" class="btn btn-outline-secondary">Ləğv et</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
