{% extends 'base.html' %}

{% block title %}Çıxış{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4">Saytı tərk etmək istəyirsiniz?</h1>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-danger">Çıxış et</button>
                        <a href="{% url 'movies:movies_list' %}" class="btn btn-outline-secondary">Ləğv et</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
